<!DOCTYPE html>
<html>
<head>
    <title>AJAX Controller Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 300px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .results { margin-top: 20px; padding: 15px; background: #f8f9fa; border-radius: 4px; border: 1px solid #ddd; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        .success { background: #d4edda; border-color: #c3e6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 AJAX Controller Test</h1>
        
        <div class="form-group">
            <label>Therapist Name:</label>
            <input type="text" id="therapist_name" value="AJAX Test Therapist">
        </div>
        
        <div class="form-group">
            <label>Description:</label>
            <textarea id="therapist_desc">AJAX test description</textarea>
        </div>
        
        <div class="form-group">
            <label>Rate:</label>
            <input type="number" id="rate" value="2000">
        </div>
        
        <div class="form-group">
            <label>Service IDs (comma-separated):</label>
            <input type="text" id="service_ids" value="1,2">
        </div>
        
        <button onclick="testAjaxAdd()">Test AJAX Add</button>
        <button onclick="testServicesLoad()">Test Services Load</button>
        <button onclick="testControllerPing()">Test Controller Ping</button>
        <button onclick="clearResults()">Clear Results</button>
        
        <div id="results" class="results" style="display: none;"></div>
    </div>

    <script>
        function addResult(title, data, type = 'info') {
            const colors = {
                info: '#d1ecf1',
                success: '#d4edda', 
                error: '#f8d7da'
            };
            
            let html = $('#results').html();
            html += '<div style="margin-bottom: 15px; padding: 10px; background: ' + (colors[type] || '#f8f9fa') + '; border-radius: 4px;">';
            html += '<h4>' + title + '</h4>';
            html += '<pre style="margin: 0; white-space: pre-wrap;">' + JSON.stringify(data, null, 2) + '</pre>';
            html += '</div>';
            
            $('#results').html(html).show();
        }

        function testControllerPing() {
            console.log('Testing controller ping...');
            
            $.ajax({
                url: 'controller/therapist_contr.php',
                type: 'POST',
                data: {
                    action: 'get_all_therapists_admin'
                },
                success: function(response) {
                    console.log('Controller ping success:', response);
                    addResult('Controller Ping - Success', response, 'success');
                },
                error: function(xhr, status, error) {
                    console.error('Controller ping failed:', xhr);
                    addResult('Controller Ping - Error', {
                        status: status,
                        error: error,
                        responseText: xhr.responseText,
                        statusCode: xhr.status
                    }, 'error');
                }
            });
        }

        function testServicesLoad() {
            console.log('Testing services load...');
            
            $.ajax({
                url: 'controller/booking_services_contr.php',
                type: 'POST',
                data: {
                    action: 'get_services'
                },
                success: function(response) {
                    console.log('Services load success:', response);
                    addResult('Services Load - Success', response, 'success');
                },
                error: function(xhr, status, error) {
                    console.error('Services load failed:', xhr);
                    addResult('Services Load - Error', {
                        status: status,
                        error: error,
                        responseText: xhr.responseText,
                        statusCode: xhr.status
                    }, 'error');
                }
            });
        }

        function testAjaxAdd() {
            console.log('Testing AJAX add therapist...');
            
            const serviceIdsStr = $('#service_ids').val();
            const serviceIdsArray = serviceIdsStr.split(',').map(id => id.trim()).filter(id => id);
            
            const requestData = {
                action: 'add_therapist',
                therapist_name: $('#therapist_name').val(),
                therapist_desc: $('#therapist_desc').val(),
                rate: parseInt($('#rate').val()) || 0,
                service_ids: serviceIdsArray
            };
            
            console.log('Sending request:', requestData);
            addResult('Request Data', requestData, 'info');
            
            $.ajax({
                url: 'controller/therapist_contr.php',
                type: 'POST',
                data: requestData,
                dataType: 'json',
                timeout: 30000,
                success: function(response) {
                    console.log('AJAX add success:', response);
                    addResult('Add Therapist - Success', response, 'success');
                },
                error: function(xhr, status, error) {
                    console.error('AJAX add failed:', xhr);
                    
                    let errorData = {
                        status: status,
                        error: error,
                        statusCode: xhr.status,
                        responseText: xhr.responseText
                    };
                    
                    // Try to parse responseText as JSON
                    try {
                        errorData.parsedResponse = JSON.parse(xhr.responseText);
                    } catch (e) {
                        errorData.parseError = 'Response is not valid JSON';
                    }
                    
                    addResult('Add Therapist - Error', errorData, 'error');
                }
            });
        }

        function clearResults() {
            $('#results').empty().hide();
        }

        // Test when page loads
        $(document).ready(function() {
            console.log('Page loaded, running initial tests...');
            setTimeout(() => {
                testControllerPing();
            }, 1000);
        });
    </script>
</body>
</html>
